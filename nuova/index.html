<script>
(function(){
var P=JSON.parse(document.getElementById('d').textContent),E=document.getElementById('e');
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function dec(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function go(pw,remember,silent){
  if(!pw)return; if(!silent)E.textContent='Verifica in corso…';
  var html;
  try{ html=await dec(pw); }catch(e){
    // la pagina potrebbe essere una copia vecchia rimasta nel browser: riprovo con quella appena scaricata
    if(e&&e.name==='OperationError'){try{
      var t=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();
      var m=t.match(/<script id="d" type="application\/json">([\s\S]*?)<\/script>/);
      if(m){var N=JSON.parse(m[1]);if(N.s!==P.s){P=N;return go(pw,remember,silent);}}
    }catch(x){}}
    try{sessionStorage.removeItem('fpw');localStorage.removeItem('fpw');}catch(x){}
    if(!silent)E.textContent=!(window.crypto&&crypto.subtle&&window.DecompressionStream)?'Browser non supportato: aggiornalo.':
      (e&&e.name==='OperationError')?'Password errata':'Errore del browser: '+((e&&(e.name+' '+e.message))||e);
    else E.textContent='';
    return;
  }
  try{sessionStorage.setItem('fpw',pw);if(remember)localStorage.setItem('fpw',pw);}catch(e){}
  try{document.open();document.write(html);document.close();}
  catch(e){E.textContent='Password giusta, ma il browser non riesce a mostrare la pagina: '+((e&&(e.name+' '+e.message))||e);}
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();go(document.getElementById('p').value,document.getElementById('r').checked,false);});
var s=null;try{s=sessionStorage.getItem('fpw')||localStorage.getItem('fpw');}catch(e){}
if(s)go(s,false,true);
})();
