<script>
(function(){
var P=JSON.parse(document.getElementById('d').textContent),E=document.getElementById('e');
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function dec(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function go(pw,remember,silent){
  if(!pw)return; if(!silent)E.textContent='Verifica in corso…';
  try{
    var html=await dec(pw);
    try{sessionStorage.setItem('fpw',pw);if(remember)localStorage.setItem('fpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{sessionStorage.removeItem('fpw');localStorage.removeItem('fpw');}catch(x){}
    if(!silent)E.textContent=(window.crypto&&crypto.subtle&&window.DecompressionStream)?'Password errata':'Browser non supportato: aggiornalo.';
    else E.textContent='';
  }
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();go(document.getElementById('p').value,document.getElementById('r').checked,false);});
var s=null;try{s=sessionStorage.getItem('fpw')||localStorage.getItem('fpw');}catch(e){}
if(s)go(s,false,true);
})();
</script></body></html>
