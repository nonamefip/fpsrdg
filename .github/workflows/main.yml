name: Aggiorna Dashboard FIP Sardegna
# aggiornato 2026-04-26

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/template.html'
      - 'cache/data_v5_new.json'
      - 'fip_sarda_data.json'
      - 'scripts/build.py'
      - 'run_update.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalita scraper'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - full-refresh
          - all-provv
          - reprovv
          - national
          - full
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:

  deploy-template-only:
    name: Deploy template (solo build)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install --quiet requests
      - name: Genera dashboard HTML
        run: python scripts/build.py
      - name: Verifica index.html
        run: |
          if [ ! -f docs/index.html ]; then
            echo "ERRORE: docs/index.html non generato"
            exit 1
          fi
          echo "docs/index.html OK ($(wc -c < docs/index.html) bytes)"
      - name: Commit docs/index.html su main
        run: |
          git config user.name "FIP Bot"
          git config user.email "fipbot@noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Dashboard aggiornata $(date '+%Y-%m-%d %H:%M')"
          git push || true
      - name: Sincronizza gh-pages
        run: |
          git fetch origin gh-pages || true
          git worktree add _ghp gh-pages 2>/dev/null || git worktree add _ghp origin/gh-pages
          cp docs/index.html _ghp/index.html
          touch _ghp/.nojekyll
          cd _ghp
          git add index.html .nojekyll
          git diff --staged --quiet || git commit -m "Deploy $(date '+%Y-%m-%d %H:%M')"
          git push origin gh-pages || true
          cd ..
          git worktree remove _ghp --force || true

  build-full:
    name: Build completo (scraper + deploy)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(toJson(github.event.commits[0].modified), 'run_update.txt'))
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache dipendenze Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Crea directory cache
        run: mkdir -p cache
      - name: Scarica dati FIP (normale)
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'normal')
        run: python scripts/fip_scraper.py --refresh-days 7
      - name: Scarica dati FIP (full-refresh)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-refresh' }}
        run: python scripts/fip_scraper.py --full-refresh
      - name: Scarica dati FIP (all-provv)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all-provv' }}
        run: python scripts/fip_scraper.py --all-provv
      - name: Scarica dati FIP (reprovv)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reprovv' }}
        run: python scripts/fip_scraper.py --reprovv
      - name: Scarica dati nazionali
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'national') ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'normal')
        run: python scripts/fip_national_scraper.py
      - name: Scarica TUTTE le gare Sardegna (full)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
        run: python scripts/fip_full_scraper.py
      - name: Costruisce calendari strutturati
        if: ${{ inputs.mode != 'full' }}
        run: python scripts/fip_calendar_scraper.py
      - name: Salva cache su GitHub
        run: |
          git config user.name "FIP Bot"
          git config user.email "fipbot@noreply.github.com"
          git add cache/fip_sardegna_cache.json || true
          git add cache/fip_national_cache.json || true
          git add cache/fip_sardegna_full_cache.json || true
          git add cache/fip_calendari.json || true
          git diff --staged --quiet || git commit -m "Cache aggiornata $(date '+%Y-%m-%d %H:%M')"
          git push || true
      - name: Genera dati JSON
        if: ${{ inputs.mode != 'full' }}
        run: python scripts/gen_data.py
      - name: Genera dashboard HTML
        if: ${{ inputs.mode != 'full' }}
        run: python scripts/build.py
      - name: Verifica index.html generato
        if: ${{ inputs.mode != 'full' }}
        run: |
          if [ ! -f docs/index.html ]; then
            echo "ERRORE: docs/index.html non generato - sito NON aggiornato"
            exit 1
          fi
          echo "docs/index.html OK ($(wc -c < docs/index.html) bytes)"
      - name: Commit docs/index.html + dati su main
        if: ${{ inputs.mode != 'full' }}
        run: |
          git pull --rebase || true
          git add docs/index.html cache/data_v5_new.json || true
          git diff --staged --quiet || git commit -m "Dashboard + dati aggiornati $(date '+%Y-%m-%d %H:%M')"
          git push || true
      - name: Sincronizza gh-pages
        if: ${{ inputs.mode != 'full' }}
        run: |
          git fetch origin gh-pages || true
          git worktree add _ghp gh-pages 2>/dev/null || git worktree add _ghp origin/gh-pages
          cp docs/index.html _ghp/index.html
          touch _ghp/.nojekyll
          cd _ghp
          git add index.html .nojekyll